<!doctype html>
<html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Em’s Nagels · Emily Portaal</title>
<meta name="theme-color" content="#f4eee7">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="site.webmanifest">
<style>
:root{--cream:#f4eee7;--white:#fff;--ink:#2c2724;--muted:#776d67;--line:#ded4cc;--accent:#b6927f;--soft:#eadbd2;--dark:#2d2825;--closed:#ece8e4}
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--cream);color:var(--ink)}button,input,select{font:inherit}.hidden{display:none!important}.small{font-size:13px;color:var(--muted);line-height:1.5}
.login-wrap{min-height:100vh;display:grid;place-items:center;padding:24px}.login{width:min(430px,100%);background:#fff;border:1px solid var(--line);border-radius:26px;padding:30px}.brand{display:flex;align-items:center;gap:14px;font-family:Georgia,serif;font-size:29px;font-weight:700}.brand img{width:64px;height:64px;object-fit:cover;border-radius:50%;border:1px solid var(--line)}.brand small{display:block;font:11px Arial;letter-spacing:.24em;margin-top:3px} .brand-text{display:flex;flex-direction:column;line-height:1}
label{display:block;font-size:12px;font-weight:700;margin:13px 0 6px}input,select{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:#fff}.btn{border:0;border-radius:999px;padding:11px 16px;background:var(--dark);color:#fff;font-weight:700;cursor:pointer}.btn.alt{background:#fff;color:var(--ink);border:1px solid var(--line)}.btn.danger{background:#fff;color:#9b4742;border:1px solid #dcbab7}.btn.sm{padding:7px 10px;font-size:12px}
.app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}.sidebar{background:var(--dark);color:#fff;padding:28px 18px;position:sticky;top:0;height:100vh}.side-brand{display:flex;align-items:center;gap:12px;font-family:Georgia,serif;font-size:25px;margin:0 10px 28px}.side-brand img{width:54px;height:54px;object-fit:cover;border-radius:50%;border:1px solid rgba(255,255,255,.2)}.side-brand small{font:10px Arial;letter-spacing:.22em;display:block;margin-top:4px;opacity:.7}.side-brand-text{display:flex;flex-direction:column;line-height:1}.menu{display:grid;gap:6px}.menu button{border:0;background:transparent;color:#eee;text-align:left;padding:12px 13px;border-radius:12px;font-weight:700}.menu button.active{background:rgba(255,255,255,.13)}.side-bottom{position:absolute;bottom:22px;left:18px;right:18px;display:grid;gap:8px}.content{padding:34px;max-width:1400px;width:100%}
.page-head{display:flex;justify-content:space-between;gap:15px;align-items:flex-start;margin-bottom:22px}.page-head h1{font-family:Georgia,serif;font-size:42px;margin:2px 0 5px}.eyebrow{text-transform:uppercase;letter-spacing:.18em;font-size:11px;font-weight:700;color:var(--accent)}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;margin-bottom:18px}.metric,.panel{background:#fff;border:1px solid var(--line);border-radius:20px}.metric{padding:18px}.metric strong{display:block;font-size:26px;margin-top:5px}.panel{padding:20px}.grid2{display:grid;grid-template-columns:1.25fr .75fr;gap:16px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.section-title{font-family:Georgia,serif;font-size:25px;margin:0 0 14px}
.kpi{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line)}table{width:100%;border-collapse:collapse}th,td{padding:10px 8px;border-bottom:1px solid var(--line);text-align:left;font-size:13px;vertical-align:top}th{font-size:11px;color:var(--muted);text-transform:uppercase}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.toolbar input,.toolbar select{width:auto;min-width:160px}
.calendar-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:13px}.calendar-head h2{font-family:Georgia,serif;margin:0}.cal-nav{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:#fff}.weekdays,.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.weekdays div{text-align:center;font-size:11px;font-weight:700;color:var(--muted)}.day{min-height:90px;border:1px solid var(--line);border-radius:12px;background:#fff;padding:8px;text-align:left;position:relative}.day.closed{background:var(--closed);color:#999}.day.selected{outline:2px solid var(--dark)}.day.today{outline:2px solid var(--accent)}.day.empty{visibility:hidden}.count{position:absolute;right:7px;top:7px;background:var(--dark);color:#fff;border-radius:999px;font-size:9px;padding:3px 6px}.mini{display:block;font-size:9px;color:var(--muted);margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.week-defaults{display:grid;grid-template-columns:repeat(7,1fr);gap:7px}.week-card{border:1px solid var(--line);border-radius:12px;padding:9px;background:#fff}.week-card input[type=checkbox]{width:auto}.chart{height:220px;display:flex;align-items:flex-end;gap:12px}.bar-wrap{flex:1;text-align:center}.bar{background:var(--soft);border-radius:9px 9px 3px 3px;position:relative;min-height:4px}.bar b{position:absolute;top:-20px;left:0;right:0;font-size:10px}.bar-label{font-size:10px;color:var(--muted);margin-top:5px}.customer{border:1px solid var(--line);border-radius:14px;padding:14px;background:#fff}.mobile{display:none}
@media(max-width:980px){.app{grid-template-columns:1fr}.sidebar{display:none}.mobile{display:flex;position:sticky;top:0;z-index:20;background:var(--dark);padding:12px;gap:7px;overflow:auto}.mobile button{white-space:nowrap;border:0;border-radius:999px;padding:9px 11px;background:rgba(255,255,255,.12);color:#fff;font-weight:700}.mobile button.active{background:#fff;color:var(--dark)}.content{padding:20px}.metrics{grid-template-columns:1fr 1fr}.grid2,.grid3{grid-template-columns:1fr}.week-defaults{grid-template-columns:1fr 1fr}.page-head h1{font-size:34px}.day{min-height:62px}}

.workmonth-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.month-day{background:#fff;border:1px solid var(--line);border-radius:14px;padding:11px}.month-day.closed{background:var(--closed)}.month-day-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:7px}.month-day input[type=checkbox]{width:auto}.month-day input[type=time]{padding:8px;margin:4px 0}.month-toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
@media(max-width:980px){.workmonth-grid{grid-template-columns:1fr 1fr}}

.manual-modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.45);display:grid;place-items:center;z-index:9999;padding:18px}
.manual-modal{width:min(560px,100%);max-height:92vh;overflow:auto;background:#fff;border-radius:22px;padding:22px;border:1px solid var(--line);box-shadow:0 20px 60px rgba(0,0,0,.18)}
.manual-modal h2{font-family:Georgia,serif;margin:0 0 6px}.manual-modal .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.manual-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
@media(max-width:650px){.manual-modal .row{grid-template-columns:1fr}}

</style></head><body>
<div id="loginScreen" class="login-wrap"><div class="login"><div class="brand"><img src="logo-ems.png" alt="Logo Em’s Nagels"><div class="brand-text">EM’S<small>EMILY PORTAAL</small></div></div><p class="small">Log in om agenda, afspraken en rapporten te beheren.</p><label>Gebruikersnaam</label><input id="loginUser" value="admin"><label>Wachtwoord</label><input id="loginPass" type="password"><button class="btn" style="width:100%;margin-top:18px" onclick="login()">Inloggen</button><div id="loginError" class="small" style="margin-top:12px"></div></div></div>
<div id="portal" class="hidden"><div class="mobile" id="mobileMenu"></div><div class="app"><aside class="sidebar"><div class="side-brand"><img src="logo-ems.png" alt="Logo Em’s Nagels"><div class="side-brand-text">EM’S<small>EMILY PORTAAL</small></div></div><div class="menu" id="sideMenu"></div><div class="side-bottom"><a class="btn alt" href="index.html" style="text-decoration:none;text-align:center">Bekijk website</a><button class="btn" onclick="logout()">Uitloggen</button></div></aside><main class="content"><section id="page-dashboard"></section><section id="page-workmonth" class="hidden"></section><section id="page-calendar" class="hidden"></section><section id="page-appointments" class="hidden"></section><section id="page-customers" class="hidden"></section><section id="page-reports" class="hidden"></section><section id="page-settings" class="hidden"></section></main></div></div>
<script>
const menu=[['dashboard','Dashboard'],['workmonth','Werkmaand'],['calendar','Agenda'],['appointments','Afspraken'],['customers','Klanten'],['reports','Rapporten'],['settings','Instellingen']],days=['Ma','Di','Wo','Do','Vr','Za','Zo'];
const treatments=[{id:'new',name:'Nieuwe set polygel',duration:120,price:72.5},{id:'refill',name:'Nabehandeling polygel',duration:90,price:45},{id:'gel',name:'Gelpolish natuurlijke nagel',duration:40,price:35}];
let data={weekly:[],overrides:[],appointments:[],mailConfigured:false},view=new Date(),workView=new Date(),selectedDate='';
view=new Date(view.getFullYear(),view.getMonth(),1);workView=new Date(workView.getFullYear(),workView.getMonth(),1);
function token(){return sessionStorage.getItem('ems_token')||''}function euro(n){return new Intl.NumberFormat('nl-NL',{style:'currency',currency:'EUR'}).format(Number(n||0))}function pad(n){return String(n).padStart(2,'0')}function key(d){return`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`}function idx(d){return(d.getDay()+6)%7}function parseDate(k){return new Date(k+'T12:00:00')}function status(a){return a.status||'Bevestigd'}function cfg(d){return data.overrides.find(x=>x.date===key(d))||data.weekly.find(x=>Number(x.dayIndex)===idx(d))}
async function api(path,opt={}){opt.headers={...(opt.headers||{}),authorization:'Bearer '+token()};const r=await fetch(path,opt),j=await r.json().catch(()=>({}));if(r.status===401){logout();throw new Error('Sessie verlopen. Log opnieuw in.')}if(!r.ok)throw new Error(j.error||'Actie mislukt');return j}
async function login(){loginError.textContent='';try{const r=await fetch('/api/admin-login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({username:loginUser.value,password:loginPass.value})}),j=await r.json();if(!r.ok)throw new Error(j.error);sessionStorage.setItem('ems_token',j.token);await openPortal()}catch(e){loginError.textContent=e.message}}
function logout(){sessionStorage.removeItem('ems_token');location.reload()}
async function openPortal(){loginScreen.classList.add('hidden');portal.classList.remove('hidden');renderMenus();await refresh();show('dashboard')}
async function refresh(){data=await api('/api/admin-data')}
if(token())openPortal().catch(()=>logout());
function renderMenus(){const h=menu.map(([i,l])=>`<button data-menu="${i}" onclick="show('${i}')">${l}</button>`).join('');sideMenu.innerHTML=h;mobileMenu.innerHTML=h}
function show(id){['dashboard','workmonth','calendar','appointments','customers','reports','settings'].forEach(x=>document.getElementById('page-'+x).classList.toggle('hidden',x!==id));document.querySelectorAll('[data-menu]').forEach(b=>b.classList.toggle('active',b.dataset.menu===id));({dashboard:renderDashboard,workmonth:renderWorkMonth,calendar:renderCalendar,appointments:renderAppointments,customers:renderCustomers,reports:renderReports,settings:renderSettings})[id]()}
function head(t,s,a=''){return`<div class="page-head"><div><div class="eyebrow">Em’s Nagels</div><h1>${t}</h1><div class="small">${s}</div></div>${a}</div>`}
function customers(){const m={};data.appointments.forEach(a=>{const k=(a.email||a.phone||a.name).toLowerCase();if(!m[k])m[k]={name:a.name,email:a.email,phone:a.phone,visits:0,total:0,last:''};m[k].visits++;m[k].total+=a.price;if(!m[k].last||a.date>m[k].last)m[k].last=a.date});return Object.values(m)}
function renderDashboard(){const tk=key(new Date()),mk=tk.slice(0,7),active=data.appointments.filter(a=>status(a)!=='Geannuleerd'),month=active.filter(a=>a.date.startsWith(mk)),today=active.filter(a=>a.date===tk),revenue=month.reduce((s,a)=>s+a.price,0),future=active.filter(a=>a.date>=tk).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));document.getElementById('page-dashboard').innerHTML=head('Dashboard','Live gegevens uit de centrale agenda.')+`<div class="metrics"><div class="metric"><span class="small">Vandaag</span><strong>${today.length}</strong></div><div class="metric"><span class="small">Deze maand</span><strong>${month.length}</strong></div><div class="metric"><span class="small">Geplande omzet</span><strong>${euro(revenue)}</strong></div><div class="metric"><span class="small">Klanten</span><strong>${customers().length}</strong></div></div><div class="grid2"><div class="panel"><h2 class="section-title">Eerstvolgende afspraken</h2>${future.slice(0,8).map(a=>`<div class="kpi"><span><b>${parseDate(a.date).toLocaleDateString('nl-NL')} · ${a.time}</b><div class="small">${a.name} · ${a.treatment}</div></span><strong>${euro(a.price)}</strong></div>`).join('')||'<div class="small">Geen toekomstige afspraken.</div>'}</div><div class="panel"><h2 class="section-title">Automatisering</h2><div class="kpi"><span>Gmail bevestigingen</span><b>${data.mailConfigured?'Actief':'Nog instellen'}</b></div><div class="kpi"><span>24-uurs reminders</span><b>${data.mailConfigured?'Actief':'Nog instellen'}</b></div><div class="kpi"><span>Klantenportaal</span><b>Actief</b></div></div></div>`}

function moveWorkMonth(n){workView=new Date(workView.getFullYear(),workView.getMonth()+n,1);renderWorkMonth()}
function renderWorkMonth(){
  const y=workView.getFullYear(),m=workView.getMonth(),max=new Date(y,m+1,0).getDate();
  document.getElementById('page-workmonth').innerHTML=head('Werkmaand','Vul per komende maand precies in op welke dagen en tijden je werkt.')+
  `<div class="panel"><div class="calendar-head"><button class="cal-nav" onclick="moveWorkMonth(-1)">‹</button><h2>${workView.toLocaleDateString('nl-NL',{month:'long',year:'numeric'})}</h2><button class="cal-nav" onclick="moveWorkMonth(1)">›</button></div>
  <div class="month-toolbar"><button class="btn alt sm" onclick="presetMonth()">Ma-vr 09:00–18:00</button><button class="btn alt sm" onclick="closeMonth()">Alles dicht</button><button class="btn alt sm" onclick="resetMonth()">Terug naar standaardweek</button><button class="btn sm" onclick="saveMonth()">Werkmaand opslaan</button></div>
  <div id="workGrid" class="workmonth-grid"></div></div>`;
  const cards=[];
  for(let n=1;n<=max;n++){const d=new Date(y,m,n),k=key(d),c=cfg(d)||{o:false,s:'09:00',e:'18:00'},wd=days[idx(d)];cards.push(`<div class="month-day ${c.o?'':'closed'}" data-date="${k}"><div class="month-day-head"><b>${wd} ${n}</b><label style="margin:0"><input class="wm-open" type="checkbox" ${c.o?'checked':''} onchange="this.closest('.month-day').classList.toggle('closed',!this.checked)"> Open</label></div><input class="wm-start" type="time" value="${c.s||'09:00'}"><input class="wm-end" type="time" value="${c.e||'18:00'}"></div>`)}
  workGrid.innerHTML=cards.join('');
}
function presetMonth(){document.querySelectorAll('.month-day').forEach(el=>{const d=parseDate(el.dataset.date),week=idx(d);el.querySelector('.wm-open').checked=week<5;el.querySelector('.wm-start').value='09:00';el.querySelector('.wm-end').value='18:00';el.classList.toggle('closed',week>=5)})}
function closeMonth(){document.querySelectorAll('.month-day').forEach(el=>{el.querySelector('.wm-open').checked=false;el.classList.add('closed')})}
async function saveMonth(){const ds=[...document.querySelectorAll('.month-day')].map(el=>({date:el.dataset.date,o:el.querySelector('.wm-open').checked,s:el.querySelector('.wm-start').value,e:el.querySelector('.wm-end').value}));await action({action:'save-month',days:ds});await refresh();renderWorkMonth();alert('Werkmaand opgeslagen.')}
async function resetMonth(){if(!confirm('Alle losse instellingen voor deze maand verwijderen en weer de standaardweek gebruiken?'))return;await action({action:'reset-month',month:`${workView.getFullYear()}-${pad(workView.getMonth()+1)}`});await refresh();renderWorkMonth()}

function moveMonth(n){view=new Date(view.getFullYear(),view.getMonth()+n,1);renderCalendar()}
function renderCalendar(){document.getElementById('page-calendar').innerHTML=head('Agenda','Bekijk afspraken en pas eventueel één losse dag aan.',`<button class="btn" onclick="manual()">+ Afspraak</button>`)+`<div class="grid2"><div class="panel"><div class="calendar-head"><button class="cal-nav" onclick="moveMonth(-1)">‹</button><h2>${view.toLocaleDateString('nl-NL',{month:'long',year:'numeric'})}</h2><button class="cal-nav" onclick="moveMonth(1)">›</button></div><div class="weekdays">${days.map(x=>`<div>${x}</div>`).join('')}</div><div class="calendar" id="cal"></div></div><div class="panel"><h2 class="section-title" id="dayTitle">Kies een dag</h2><div id="dayEditor" class="small">Klik op een datum.</div></div></div>`;const first=new Date(view.getFullYear(),view.getMonth(),1),off=idx(first),max=new Date(view.getFullYear(),view.getMonth()+1,0).getDate();cal.innerHTML='';for(let i=0;i<off;i++)cal.innerHTML+='<div class="day empty"></div>';for(let n=1;n<=max;n++){const d=new Date(view.getFullYear(),view.getMonth(),n),k=key(d),c=cfg(d),apps=data.appointments.filter(a=>a.date===k&&status(a)!=='Geannuleerd');cal.innerHTML+=`<button class="day ${c?.o?'':'closed'} ${k===selectedDate?'selected':''} ${k===key(new Date())?'today':''}" onclick="selectDay('${k}')"><b>${n}</b>${apps.length?`<span class="count">${apps.length}</span>`:''}${apps.slice(0,2).map(a=>`<span class="mini">${a.time} ${a.name}</span>`).join('')}</button>`}if(selectedDate&&selectedDate.startsWith(`${view.getFullYear()}-${pad(view.getMonth()+1)}`))selectDay(selectedDate,false)}
function selectDay(k,rerender=true){selectedDate=k;if(rerender)renderCalendar();const d=parseDate(k),c=cfg(d)||{o:false,s:'09:00',e:'18:00'},apps=data.appointments.filter(a=>a.date===k).sort((a,b)=>a.time.localeCompare(b.time));dayTitle.textContent=d.toLocaleDateString('nl-NL',{weekday:'long',day:'numeric',month:'long'});dayEditor.innerHTML=`<div class="form-grid"><div><label>Open / gesloten</label><select id="dayOpen"><option value="1" ${c.o?'selected':''}>Open</option><option value="0" ${!c.o?'selected':''}>Gesloten</option></select></div><div></div><div><label>Vanaf</label><input id="dayStart" type="time" value="${c.s}"></div><div><label>Tot</label><input id="dayEnd" type="time" value="${c.e}"></div></div><div style="display:flex;gap:8px;margin:12px 0 18px"><button class="btn sm" onclick="saveDay('${k}')">Opslaan</button><button class="btn alt sm" onclick="resetDay('${k}')">Standaard</button></div><h3>Afspraken</h3>${apps.map(a=>`<div class="kpi"><span><b>${a.time} · ${a.name}</b><div class="small">${a.treatment}</div></span><span>${status(a)}</span></div>`).join('')||'<div class="small">Geen afspraken.</div>'}`}
async function action(body){await api('/api/admin-action',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)});await refresh()}
async function saveDay(k){await action({action:'set-override',date:k,o:dayOpen.value==='1',s:dayStart.value,e:dayEnd.value});renderCalendar()}
async function resetDay(k){await action({action:'reset-override',date:k});renderCalendar()}
function manual(){
  manualName.value='';manualEmail.value='';manualPhone.value='';
  manualDate.value=key(new Date());manualTime.value='09:00';manualTreatment.value='new';manualMsg.textContent='';
  manualModal.classList.remove('hidden');
}
function closeManual(){manualModal.classList.add('hidden')}
async function saveManual(){
  const name=manualName.value.trim(),email=manualEmail.value.trim(),phone=manualPhone.value.trim(),date=manualDate.value,time=manualTime.value,treatmentId=manualTreatment.value;
  if(!name||!date||!time){manualMsg.textContent='Vul naam, datum en tijd in.';return}
  if(email && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){manualMsg.textContent='Controleer het e-mailadres.';return}
  manualMsg.textContent='Afspraak opslaan…';
  try{
    const result=await api('/api/admin-action',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({action:'manual-book',name,email,phone,date,time,treatmentId})});
    await refresh();
    closeManual();
    show('calendar');
    if(email){
      alert(result.emailSent?'Afspraak opgeslagen en bevestigingsmail verstuurd.':'Afspraak opgeslagen. De bevestigingsmail kon niet worden verstuurd.');
    }else{
      alert('Privé-afspraak opgeslagen zonder e-mail of telefoon.');
    }
  }catch(e){manualMsg.textContent=e.message}
}
function renderAppointments(){document.getElementById('page-appointments').innerHTML=head('Afspraken','Alle boekingen uit de centrale database.',`<button class="btn" onclick="manual()">+ Afspraak</button>`)+`<div class="panel"><div class="toolbar"><input id="search" placeholder="Zoek klant" oninput="rows()"><select id="st" onchange="rows()"><option value="">Alle statussen</option><option>Bevestigd</option><option>Afgerond</option><option>Geannuleerd</option><option>No-show</option></select></div><div style="overflow:auto"><table><thead><tr><th>Datum</th><th>Tijd</th><th>Klant</th><th>Behandeling</th><th>Prijs</th><th>Status</th><th></th></tr></thead><tbody id="tbody"></tbody></table></div></div>`;rows()}
function rows(){const q=(search?.value||'').toLowerCase(),s=st?.value||'';tbody.innerHTML=data.appointments.filter(a=>(!q||a.name.toLowerCase().includes(q)||a.email.toLowerCase().includes(q))&&(!s||status(a)===s)).map(a=>`<tr><td>${parseDate(a.date).toLocaleDateString('nl-NL')}</td><td>${a.time}</td><td><b>${a.name}</b><div class="small">${a.email}<br>${a.phone}</div></td><td>${a.treatment}</td><td>${euro(a.price)}</td><td><select onchange="changeStatus(${a.id},this.value)"><option ${status(a)==='Bevestigd'?'selected':''}>Bevestigd</option><option ${status(a)==='Afgerond'?'selected':''}>Afgerond</option><option ${status(a)==='Geannuleerd'?'selected':''}>Geannuleerd</option><option ${status(a)==='No-show'?'selected':''}>No-show</option></select></td><td><button class="btn danger sm" onclick="del(${a.id})">Verwijder</button></td></tr>`).join('')||'<tr><td colspan="7">Geen afspraken.</td></tr>'}
async function changeStatus(id,status){await action({action:'status',id,status});show('appointments')}async function del(id){if(confirm('Afspraak verwijderen?')){await action({action:'delete',id});show('appointments')}}
function renderCustomers(){const c=customers().sort((a,b)=>b.last.localeCompare(a.last));document.getElementById('page-customers').innerHTML=head('Klanten','Automatisch opgebouwd uit afspraken.')+`<div class="grid3">${c.map(x=>`<div class="customer"><b>${x.name}</b><div class="small">${x.email||'Geen e-mail'}<br>${x.phone||'Geen telefoon'}</div><div class="kpi"><span>Bezoeken</span><b>${x.visits}</b></div><div class="kpi"><span>Waarde</span><b>${euro(x.total)}</b></div></div>`).join('')||'<div class="small">Nog geen klanten.</div>'}</div>`}
function renderReports(){const now=new Date(),months=[];for(let i=5;i>=0;i--){const d=new Date(now.getFullYear(),now.getMonth()-i,1);months.push({k:`${d.getFullYear()}-${pad(d.getMonth()+1)}`,l:d.toLocaleDateString('nl-NL',{month:'short'}),v:0,c:0})}data.appointments.filter(a=>status(a)!=='Geannuleerd').forEach(a=>{const m=months.find(m=>a.date.startsWith(m.k));if(m){m.v+=a.price;m.c++}});const max=Math.max(1,...months.map(m=>m.v));document.getElementById('page-reports').innerHTML=head('Rapporten','Live uit de centrale database.')+`<div class="panel"><h2 class="section-title">Omzet laatste 6 maanden</h2><div class="chart">${months.map(m=>`<div class="bar-wrap"><div class="bar" style="height:${Math.max(4,m.v/max*170)}px"><b>${euro(m.v)}</b></div><div class="bar-label">${m.l}</div></div>`).join('')}</div></div><div class="panel" style="margin-top:16px"><table><thead><tr><th>Maand</th><th>Afspraken</th><th>Omzet</th></tr></thead><tbody>${months.slice().reverse().map(m=>`<tr><td>${m.k}</td><td>${m.c}</td><td>${euro(m.v)}</td></tr>`).join('')}</tbody></table></div>`}
function renderSettings(){document.getElementById('page-settings').innerHTML=head('Instellingen','De standaardweek is alleen de fallback voor maanden die nog niet via Werkmaand zijn ingevuld.')+`<div class="panel"><h2 class="section-title">Standaard werkweek</h2><div id="week" class="week-defaults"></div></div><div class="panel" style="margin-top:16px"><h2 class="section-title">Behandelingen</h2>${treatments.map(t=>`<div class="kpi"><span><b>${t.name}</b><div class="small">${t.duration} min</div></span><b>${euro(t.price)}</b></div>`).join('')}</div><div class="panel" style="margin-top:16px"><h2 class="section-title">E-mail & klantenportaal</h2><div class="kpi"><span>Gmail</span><b>${data.mailConfigured?'Actief':'Nog instellen'}</b></div><div class="kpi"><span>Mijn afspraken</span><b>Actief</b></div></div>`;week.innerHTML=data.weekly.map(w=>`<div class="week-card"><b>${days[w.dayIndex]}</b><label><input id="o${w.dayIndex}" type="checkbox" ${w.o?'checked':''}> Open</label><input id="s${w.dayIndex}" type="time" value="${w.s}"><input id="e${w.dayIndex}" type="time" value="${w.e}"><button class="btn sm" style="margin-top:8px;width:100%" onclick="saveWeek(${w.dayIndex})">Opslaan</button></div>`).join('')}
async function saveWeek(i){await action({action:'set-week',dayIndex:i,o:document.getElementById('o'+i).checked,s:document.getElementById('s'+i).value,e:document.getElementById('e'+i).value});renderSettings()}
</script>
<div id="manualModal" class="manual-modal-backdrop hidden">
  <div class="manual-modal">
    <h2>Handmatig afspraak toevoegen</h2>
    <p class="small">E-mail en telefoon zijn optioneel. Laat ze leeg voor een privé-afspraak zonder bevestigingen of klantenportaal.</p>
    <label>Naam *</label>
    <input id="manualName" placeholder="Naam klant">
    <div class="row">
      <div><label>E-mail</label><input id="manualEmail" type="email" placeholder="optioneel"></div>
      <div><label>Telefoonnummer</label><input id="manualPhone" type="tel" placeholder="optioneel"></div>
    </div>
    <div class="row">
      <div><label>Datum *</label><input id="manualDate" type="date"></div>
      <div><label>Tijd *</label><input id="manualTime" type="time" value="09:00"></div>
    </div>
    <label>Behandeling *</label>
    <select id="manualTreatment">
      <option value="new">Nieuwe set polygel · 120 min · €72,50</option>
      <option value="refill">Nabehandeling polygel · 90 min · €45,00</option>
      <option value="gel">Gelpolish natuurlijke nagel · 40 min · €35,00</option>
    </select>
    <div id="manualMsg" class="small" style="margin-top:10px"></div>
    <div class="manual-actions">
      <button class="btn alt" onclick="closeManual()">Annuleren</button>
      <button class="btn" onclick="saveManual()">Afspraak opslaan</button>
    </div>
  </div>
</div>

</body></html>
