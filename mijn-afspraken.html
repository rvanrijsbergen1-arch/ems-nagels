<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mijn afspraken · Em’s Nagels</title>
<meta name="theme-color" content="#f4eee7">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="site.webmanifest">
<style>
:root{--cream:#f4eee7;--white:#fff;--ink:#2c2724;--muted:#776d67;--line:#ded4cc;--dark:#2d2825;--soft:#eadbd2}
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--cream);color:var(--ink)}.wrap{max-width:900px;margin:auto;padding:24px}.brand{display:flex;align-items:center;gap:12px;font-family:Georgia,serif;font-size:28px;font-weight:700}.brand img{width:52px;height:52px;object-fit:cover;border-radius:50%;border:1px solid var(--line)}.brand-text{display:flex;flex-direction:column;line-height:1}.brand-text span{font-family:Arial;font-size:11px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:#8c7466;margin-top:4px}.card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:22px;margin-top:18px}.small{font-size:13px;color:var(--muted);line-height:1.5}h1,h2{font-family:Georgia,serif}.btn{display:inline-block;border:0;border-radius:999px;padding:12px 17px;background:var(--dark);color:#fff;text-decoration:none;font-weight:700;cursor:pointer}.btn.alt{background:#fff;color:var(--ink);border:1px solid var(--line)}.btn.danger{background:#fff;color:#9b4742;border:1px solid #d9b6b1}input{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;font:inherit;margin:6px 0 12px}.hidden{display:none}.appt{border:1px solid var(--line);border-radius:15px;padding:14px;margin:10px 0;display:grid;grid-template-columns:1fr auto;gap:12px}.pill{display:inline-block;background:var(--soft);border-radius:999px;padding:5px 8px;font-size:11px;font-weight:700}.nav{display:flex;justify-content:space-between;align-items:center;gap:10px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}@media(max-width:650px){.appt{grid-template-columns:1fr}.wrap{padding:16px}.brand img{width:44px;height:44px}}
</style></head><body><div class="wrap"><div class="nav"><a class="brand" href="index.html" style="color:inherit;text-decoration:none"><img src="logo-ems.png" alt="Logo Em’s Nagels"><span class="brand-text">EM’S<span>nagels</span></span></a><a href="index.html#boeken" class="btn alt">Nieuwe afspraak</a></div>
<div id="loginCard" class="card"><h1>Mijn afspraken</h1><p class="small">Vul hetzelfde e-mailadres in als waarmee je hebt geboekt. Je ontvangt een eenmalige inlogcode.</p><label>E-mailadres</label><input id="email" type="email" autocomplete="email"><button class="btn" onclick="sendCode()">Stuur inlogcode</button><div id="msg" class="small" style="margin-top:12px"></div>
<div id="codeBox" class="hidden"><label>6-cijferige code</label><input id="code" inputmode="numeric" maxlength="6"><button class="btn" onclick="verify()">Inloggen</button></div></div>
<div id="portal" class="hidden"><div class="card"><div class="nav"><div><h1 style="margin:0">Mijn afspraken</h1><div id="who" class="small"></div></div><button class="btn alt" onclick="logout()">Uitloggen</button></div></div><div id="future" class="card"></div><div id="history" class="card"></div></div></div>
<script>
function euro(n){return new Intl.NumberFormat('nl-NL',{style:'currency',currency:'EUR'}).format(Number(n||0))}
function token(){return localStorage.getItem('ems_customer_token')||''}
async function req(path,opt={}){opt.headers={...(opt.headers||{}),authorization:'Bearer '+token()};const r=await fetch(path,opt),j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||'Er ging iets mis.');return j}
async function sendCode(){msg.textContent='Even versturen…';try{const r=await fetch('/api/customer-login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({email:email.value})}),j=await r.json();if(!r.ok)throw new Error(j.error);codeBox.classList.remove('hidden');msg.textContent='Code verstuurd. Kijk ook even in je spam.'}catch(e){msg.textContent=e.message}}
async function verify(){try{const r=await fetch('/api/customer-verify',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({email:email.value,code:code.value})}),j=await r.json();if(!r.ok)throw new Error(j.error);localStorage.setItem('ems_customer_token',j.token);await load()}catch(e){msg.textContent=e.message}}
function logout(){localStorage.removeItem('ems_customer_token');location.reload()}
function card(a){const date=new Date(a.date+'T12:00:00').toLocaleDateString('nl-NL',{weekday:'long',day:'numeric',month:'long',year:'numeric'});return `<div class="appt"><div><b>${a.treatment}</b><div class="small">${date} · ${a.time} · ${euro(a.price)}</div><div style="margin-top:7px"><span class="pill">${a.status}</span></div></div><div>${a.canCancel?`<button class="btn danger" onclick="cancelAppt(${a.id})">Annuleren</button>`:''}</div></div>`}
async function cancelAppt(id){if(!confirm('Weet je zeker dat je deze afspraak wilt annuleren?'))return;try{await req('/api/customer-cancel',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({id})});await load()}catch(e){alert(e.message)}}
async function load(){if(!token())return;try{const d=await req('/api/customer-data');loginCard.classList.add('hidden');portal.classList.remove('hidden');who.textContent=d.email;const now=new Date().toISOString().slice(0,10),up=d.appointments.filter(a=>a.date>=now&&a.status!=='Geannuleerd'),hist=d.appointments.filter(a=>a.date<now||a.status==='Geannuleerd');future.innerHTML='<h2>Komende afspraken</h2>'+(up.map(card).join('')||'<p class="small">Geen komende afspraken.</p>');history.innerHTML='<h2>Eerdere afspraken</h2>'+(hist.map(card).join('')||'<p class="small">Nog geen historie.</p>')}catch(e){localStorage.removeItem('ems_customer_token')}}
load();
</script></body></html>
